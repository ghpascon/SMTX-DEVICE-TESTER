{% extends "base.html" %} {% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-lg shadow border p-6" x-data="writeListPage()">
            <h2 class="text-xl font-bold mb-4 text-gray-900">Write List</h2>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4 items-end">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Prefix</label>
                    <input type="text" x-model="prefix" maxlength="8"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent font-mono text-sm"
                        placeholder="hex prefix" />
                </div>

                <div class="md:col-span-2 flex gap-2">
                    <button type="button" @click="loadTags()"
                        class="bg-white border border-blue-300 hover:bg-blue-50 text-blue-700 px-4 py-2 rounded text-sm font-medium">Reload
                        Tags</button>
                    <button type="button" @click="selectAll()"
                        class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2 rounded text-sm font-medium">Select
                        All</button>
                    <button type="button" @click="deselectAll()"
                        class="bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2 rounded text-sm font-medium">Deselect
                        All</button>
                </div>
            </div>

            <div class="border rounded overflow-hidden mb-4">
                <div class="overflow-x-auto overflow-y-auto h-64">
                    <table class="min-w-full border-collapse">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th
                                    class="px-2 py-2 text-left whitespace-nowrap border-b-2 border-gray-200 font-mono text-xs font-semibold text-gray-900">
                                    Select</th>
                                <template x-for="header in headers" :key="header">
                                    <th class="px-2 py-2 text-left whitespace-nowrap border-b-2 border-gray-200 font-mono text-xs font-semibold text-gray-900"
                                        x-text="formatHeader(header)"></th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template x-for="(tag, index) in tags" :key="tag.epc || index">
                                <tr class="border-b border-gray-200 hover:bg-gray-50">
                                    <td class="px-2 py-2 font-mono text-xs sm:text-sm whitespace-nowrap text-gray-900">
                                        <input type="checkbox" :value="tag.epc" x-model="selectedEpcs"
                                            class="w-4 h-4" />
                                    </td>
                                    <template x-for="header in headers" :key="header">
                                        <td class="px-2 py-2 font-mono text-xs sm:text-sm whitespace-nowrap text-gray-900"
                                            x-text="formatValue(tag[header], header)"></td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>

                    <div x-show="tags.length === 0" class="p-8 text-center text-gray-400">No tags found</div>
                </div>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="button" @click="submitWriteList()" :disabled="loading"
                    class="flex-1 bg-blue-500 hover:bg-blue-600 disabled:bg-gray-400 text-white font-medium py-2 px-4 rounded-lg transition-colors text-sm">Send
                    Write List</button>
                <button type="button" @click="goBack()"
                    class="px-4 py-2 bg-gray-200 hover:bg-gray-300 text-gray-700 font-medium rounded-lg transition-colors text-sm">Back</button>
            </div>
        </div>
    </div>
</div>

<script>
    function writeListPage() {
        return {
            tags: [],
            headers: [],
            selectedEpcs: [],
            prefix: 'abc',
            loading: false,
            lastTagsPayload: '',

            init() {
                this.loadTags();
            },


            getTagsUrl() {
                return "{{ url_for('get_tags') }}";
            },

            async loadTags() {
                if (this.loading) return;
                this.loading = true;
                try {
                    const result = await TemplateUtils.fetchJsonIfChanged(this.getTagsUrl(), this.lastTagsPayload);
                    if (!result.changed) {
                        return;
                    }
                    this.lastTagsPayload = result.payload;

                    const data = result.data;
                    this.tags = Array.isArray(data) ? data : data.tags || [];

                    // Build headers dynamically from first tag
                    this.headers = this.tags.length > 0 ? Object.keys(this.tags[0]) : [];
                    // Prefer epc first
                    const epcIndex = this.headers.indexOf('epc');
                    if (epcIndex > -1) {
                        this.headers.splice(epcIndex, 1);
                        this.headers.unshift('epc');
                    }

                    // Ensure selected epcs still exist
                    this.selectedEpcs = this.selectedEpcs.filter((e) => this.tags.find(t => t.epc === e));
                } catch (e) {
                    console.error('Error loading tags:', e);
                } finally {
                    this.loading = false;
                }
            },

            formatHeader(header) {
                return header.replace(/_/g, ' ').toUpperCase();
            },

            formatValue(value, header) {
                if (value === null || value === undefined) return '-';
                // Timestamps handling
                if (header.toLowerCase().includes('timestamp') || header.toLowerCase().includes('first_seen') || header.toLowerCase().includes('time')) {
                    try {
                        const date = new Date(value);
                        if (!isNaN(date.getTime())) {
                            return date.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                        }
                    } catch (e) {
                        // ignore
                    }
                }
                if (typeof value === 'object') {
                    try {
                        return JSON.stringify(value);
                    } catch (e) {
                        return String(value);
                    }
                }
                return String(value);
            },

            selectAll() {
                this.selectedEpcs = this.tags.map((t) => t.epc).filter(Boolean);
            },

            deselectAll() {
                this.selectedEpcs = [];
            },

            async submitWriteList() {
                if (this.selectedEpcs.length === 0) {
                    showAlert('No EPCs selected', 'error');
                    return;
                }
                if (!/^[0-9a-fA-F]*$/.test(this.prefix)) {
                    showAlert('Prefix must be hexadecimal', 'error');
                    return;
                }

                this.loading = true;
                try {
                    const res = await fetch("{{ url_for('create_write_list_prefix') }}", {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ epcs: this.selectedEpcs, prefix: this.prefix }),
                    });

                    const data = await res.json();
                    showAlert(data.message || (res.ok ? 'Write list sent' : 'Failed to send write list'), res.ok ? 'success' : 'error');
                } catch (e) {
                    console.error('Error sending write list:', e);
                    showAlert('Error communicating with server', 'error');
                } finally {
                    this.loading = false;
                }
            },

            goBack() {
                window.location.href = "{{ url_for('write_page') }}";
            },
        };
    }
</script>
{% endblock %}
