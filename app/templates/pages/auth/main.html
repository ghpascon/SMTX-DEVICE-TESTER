{% extends "base.html" %} {% block content %}

<div
  class="min-h-screen flex items-center justify-center bg-gradient-to-r from-blue-200 via-blue-100 to-blue-200 p-6 overflow-hidden">
  <!-- MAIN CARD -->
  <div class="w-4/5 max-w-3xl bg-white rounded-2xl overflow-hidden flex flex-col lg:flex-row">
    <!-- LEFT SIDE - LOGIN -->
    <div class="lg:w-1/2 p-10 flex flex-col justify-center">
      <h2 class="text-3xl font-bold text-gray-800 mb-2 text-center">
        {{ title }}
      </h2>

      <p class="text-sm text-gray-500 text-center mb-8">
        Bem-vindo de volta! Faça login em sua conta.
      </p>

      <form method="post" action="{{ url_for('login') }}" class="space-y-6">
        <!-- Nome de usuário -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Nome de usuário
          </label>
          <input type="text" name="username" required placeholder="Digite seu nome de usuário"
            class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
        </div>

        <!-- Senha -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            Senha
          </label>
          <div class="relative">
            <input type="password" id="loginPassword" name="password" required placeholder="Digite sua senha"
              class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition" />
            <button type="button" class="absolute right-3 top-3 text-gray-500 hover:text-gray-700"
              onclick="togglePasswordVisibility('loginPassword')">
              👀
            </button>
          </div>
        </div>

        <!-- Botão -->
        <button type="submit" id="loginSubmit"
          class="w-full py-3 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition duration-300 shadow-md hover:shadow-lg flex items-center justify-center">
          <svg id="loginSubmitSpinner" class="hidden animate-spin h-5 w-5 text-white mr-2"
            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
          </svg>
          <span id="loginSubmitText">Entrar</span>
        </button>
      </form>
    </div>

    <!-- RIGHT SIDE - IMAGE FULL -->
    <div class="lg:w-1/2 flex items-center justify-center p-6">
      <img src="{{ url_for('static', path='images/logo.png') }}" alt="Login Image" class="object-contain"
        style="width:70%; height:auto;" />
    </div>
  </div>
</div>

<script>
  function togglePasswordVisibility(inputId) {
    const input = document.getElementById(inputId);
    input.type = input.type === "password" ? "text" : "password";
  }

  function setSubmitLoading(btn, loading) {
    if (!btn) return;
    const spinner = btn.querySelector('#loginSubmitSpinner');
    const text = btn.querySelector('#loginSubmitText');
    if (loading) {
      btn.disabled = true;
      btn.classList.add('opacity-60', 'cursor-not-allowed');
      if (spinner) spinner.classList.remove('hidden');
      if (text) text.textContent = 'Entrando...';
    } else {
      btn.disabled = false;
      btn.classList.remove('opacity-60', 'cursor-not-allowed');
      if (spinner) spinner.classList.add('hidden');
      if (text) text.textContent = 'Entrar';
    }
  }

  document.querySelector("form").addEventListener("submit", async (event) => {
    event.preventDefault();

    const form = event.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    setSubmitLoading(submitBtn, true);

    const formData = new FormData(form);
    const payload = Object.fromEntries(formData.entries());

    try {
      const response = await fetch(form.action, {
        method: form.method,
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(payload),
      });

      if (!response.ok) {
        const errorData = await response.json();
        showAlert(errorData.error || "Ocorreu um erro", "error");
        setSubmitLoading(submitBtn, false);
      } else {
        // Redirect to the index page on success
        window.location.href = "{{ url_for('index') }}";
      }
    } catch (error) {
      showAlert("Falha ao conectar com o servidor", "error");
      setSubmitLoading(submitBtn, false);
    }
  });
</script>

{% endblock %}
