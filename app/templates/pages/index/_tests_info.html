<div class="bg-white rounded-lg shadow p-4 mb-4" x-data="testsInfo()">
    <div class="flex items-center justify-between">
        <h3 class="text-lg font-semibold">Status dos Testes</h3>
        <div class="flex items-center gap-3">
            <div class="text-sm text-gray-500" x-text="lastUpdatedText()"></div>
            <button @click="reloadDevice()" :disabled="!current_device || reloading"
                class="text-sm px-3 py-1 rounded-md bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50"
                type="button">
                Recarregar
            </button>
            <button @click="resetTests()" :disabled="resetting"
                class="text-sm px-3 py-1 rounded-md bg-red-600 text-white hover:bg-red-700 disabled:opacity-50"
                type="button">
                Resetar
            </button>
        </div>
    </div>

    <div class="mt-3">
        <div class="text-sm text-gray-600">Dispositivo atual</div>
        <div class="flex items-center gap-3 mt-2">
            <div class="w-3 h-3 rounded-full" :class="current_device ? 'bg-green-500' : 'bg-gray-300'"></div>
            <div class="font-medium" x-text="current_device || 'Nenhum'"></div>
        </div>
    </div>

    <div class="mt-3">
        <div class="text-sm text-gray-600 mb-2">Testes</div>
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <template x-for="(pair, idx) in Object.entries(tests)" :key="idx">
                <div class="flex items-center gap-2 p-2 bg-gray-50 rounded">
                    <div class="w-6 h-6 flex items-center justify-center rounded-full"
                        :class="pair[1] ? 'bg-green-600 text-white' : 'bg-gray-600 text-dark'">
                        <span x-text="pair[1] ? '✓' : '–'"></span>
                    </div>
                    <div class="text-sm truncate" x-text="pair[0]"></div>
                </div>
            </template>
        </div>
        <div x-show="Object.keys(tests).length === 0" class="text-sm text-gray-400 mt-2">Nenhum teste carregado</div>
    </div>

    <div class="mt-4">
        <button @click="markTested()" :disabled="!canFinish || marking"
            class="w-full py-3 text-base font-semibold rounded-lg bg-green-600 text-white hover:bg-green-700 disabled:opacity-50 flex items-center justify-center gap-2"
            type="button">
            <svg x-show="marking" class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none"
                viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <span x-text="marking ? 'Processando...' : 'Marcar como testado'"></span>
        </button>
    </div>
    <!-- Success modal (opened after markTested success) -->
    <div x-show="showSuccessModal" x-cloak class="fixed inset-0 z-50 flex items-center justify-center px-4">
        <div class="fixed inset-0 bg-black/50" @click="closeSuccessModal()"></div>
        <div class="relative bg-white rounded-lg shadow-lg max-w-lg w-full p-4 mx-auto">
            <div class="flex items-start justify-between">
                <h4 class="text-lg font-semibold">Leitor marcado como testado</h4>
                <button @click="closeSuccessModal()" class="text-gray-500 hover:text-gray-700">✕</button>
            </div>
            <div class="mt-3 text-sm text-gray-600" x-text="modalMessage"></div>
            <div class="mt-4 grid grid-cols-1 sm:grid-cols-3 gap-2">
                <button @click="modalReset()" :disabled="resetting"
                    class="py-2 px-3 rounded bg-red-600 text-white hover:bg-red-700 disabled:opacity-50">Mudar
                    device</button>
                <button @click="modalReload()" :disabled="reloading"
                    class="py-2 px-3 rounded bg-blue-600 text-white hover:bg-blue-700 disabled:opacity-50">Reiniciar
                    testes</button>
                <button @click="modalPrint()" :disabled="printing"
                    class="py-2 px-3 rounded bg-gray-800 text-white hover:bg-gray-900 disabled:opacity-50">
                    <svg x-show="printing" class="animate-spin inline-block h-4 w-4 mr-2"
                        xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4">
                        </circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                    </svg>
                    Imprimir etiqueta
                </button>
            </div>
            <div class="mt-3 text-right">
                <button @click="closeSuccessModal()" class="text-sm text-gray-600 hover:underline">Fechar</button>
            </div>
        </div>
    </div>
</div>

<script>
    function testsInfo() {
        return {
            current_device: null,
            tests: {},
            resetting: false,
            reloading: false,
            marking: false,
            canFinish: false,
            lastPayload: '',
            lastUpdated: null,

            init() {
                this.load();
                this.validateTests();
                TemplateUtils.bindVisibilityPolling(this, async () => {
                    await this.load();
                    await this.validateTests();
                }, 1000);
            },

            destroy() {
                TemplateUtils.unbindVisibilityPolling(this);
            },

            lastUpdatedText() {
                return this.lastUpdated ? new Date(this.lastUpdated).toLocaleTimeString() : '';
            },

            // modal state
            showSuccessModal: false,
            modalMessage: '',
            printing: false,

            closeSuccessModal() {
                this.showSuccessModal = false;
            },

            async modalReset() {
                // Reset and navigate away
                this.showSuccessModal = false;
                await this.resetTestsSilent();
            },

            async modalReload() {
                // Reload tests for same device
                this.showSuccessModal = false;
                await this.reloadDevice();
            },

            async modalPrint() {
                // Call print_label endpoint but keep modal open
                if (this.printing) return;
                this.printing = true;
                try {
                    const res = await fetch('{{ url_for("print_label") }}', { method: 'POST' });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok) {
                        window.showAlert(data.message || 'Etiqueta impressa', 'success');
                    } else {
                        const errMsg = (data && data.message) ? data.message : `Erro ${res.status}: Falha ao imprimir etiqueta`;
                        window.showAlert(errMsg, 'error');
                    }
                } catch (err) {
                    console.error('Erro ao imprimir etiqueta', err);
                    window.showAlert('Erro ao imprimir etiqueta', 'error');
                } finally {
                    this.printing = false;
                }
            },

            async load() {
                try {
                    const result = await TemplateUtils.fetchJsonIfChanged('{{ url_for("get_current_tests") }}', this.lastPayload);
                    if (result.changed) {
                        this.lastPayload = result.payload;
                        const data = result.data || {};
                        this.current_device = data.current_device || null;
                        this.tests = data.tests || {};
                        this.current_config = data.current_config || null;
                        this.lastUpdated = Date.now();
                    }
                } catch (err) {
                    console.error('Erro ao carregar status dos testes', err);
                }
            },

            async reloadDevice() {
                if (!this.current_device) return;
                if (this.reloading) return;
                this.reloading = true;
                try {
                    const endpoint = '{{ url_for("set_test_device", device_name="__DEVICENAME__") }}'.replace('__DEVICENAME__', encodeURIComponent(this.current_device));
                    // send previous device configuration if available so reload uses same config
                    const options = { method: 'POST' };
                    if (this.current_config) {
                        const form = new FormData();
                        form.append('device_config', JSON.stringify(this.current_config));
                        options.body = form;
                    }
                    const res = await fetch(endpoint, options);
                    if (res.ok) {
                        // refresh current tests info
                        await this.load();
                        window.showAlert('Dispositivo recarregado', 'success');
                    } else {
                        let data = {};
                        try { data = await res.json(); } catch (e) { }
                        window.showAlert(data.message || 'Falha ao recarregar dispositivo', 'error');
                    }
                } catch (err) {
                    console.error('Erro ao recarregar device', err);
                    window.showAlert('Erro ao recarregar dispositivo', 'error');
                } finally {
                    this.reloading = false;
                }
            },

            async validateTests() {
                try {
                    const res = await fetch('{{ url_for("validate_tests") }}');
                    if (res.ok) {
                        const data = await res.json();
                        this.canFinish = data === true || data?.valid === true;
                    } else {
                        this.canFinish = false;
                    }
                } catch (err) {
                    this.canFinish = false;
                }
            },

            async markTested() {
                if (!this.canFinish || this.marking) return;
                this.marking = true;
                try {
                    const res = await fetch('{{ url_for("mark_tested") }}', { method: 'POST' });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok) {
                        window.showAlert(data.message || 'Leitor marcado como testado', 'success');
                        // open modal to ask next action: reset, reload or print again
                        this.modalMessage = data.message || 'Leitor marcado como testado';
                        this.showSuccessModal = true;
                    } else {
                        const errMsg = (data && data.message) ? data.message : `Erro ${res.status}: Falha ao marcar como testado`;
                        window.showAlert(errMsg, 'error');
                    }
                } catch (err) {
                    console.error('Erro ao marcar como testado', err);
                    window.showAlert('Erro ao marcar como testado', 'error');
                } finally {
                    this.marking = false;
                }
            },

            async resetTestsSilent() {
                try {
                    const res = await fetch('{{ url_for("reset_tests") }}', { method: 'DELETE' });
                    if (res.ok) {
                        window.location.href = '{{ url_for("index") }}';
                    } else {
                        let data = {};
                        try { data = await res.json(); } catch (e) { }
                        window.showAlert(data.message || 'Falha ao resetar testes', 'error');
                    }
                } catch (err) {
                    console.error('Erro ao resetar testes', err);
                    window.showAlert('Erro ao resetar testes', 'error');
                }
            },

            async resetTests() {
                if (!confirm('Tem certeza que deseja resetar os testes?')) return;
                if (this.resetting) return;
                this.resetting = true;
                try {
                    const res = await fetch('{{ url_for("reset_tests") }}', { method: 'DELETE' });
                    if (res.ok) {
                        window.location.href = '{{ url_for("index") }}';
                    } else {
                        let data = {};
                        try { data = await res.json(); } catch (e) { }
                        window.showAlert(data.message || 'Falha ao resetar testes', 'error');
                    }
                } catch (err) {
                    console.error('Erro ao resetar testes', err);
                    window.showAlert('Erro ao resetar testes', 'error');
                } finally {
                    this.resetting = false;
                }
            },
        };
    }
</script>
